name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format pow
        working-directory: code/pow
        run: cargo fmt --check
      - name: Format cache
        working-directory: code/cache
        run: cargo fmt --check
      - name: Format common
        working-directory: code/common
        run: cargo fmt --check
      - name: Format back
        working-directory: code/back
        run: cargo fmt --check
      - name: Format front
        working-directory: code/front
        run: cargo fmt --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy pow
        working-directory: code/pow
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy cache
        working-directory: code/cache
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy common
        working-directory: code/common
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy back
        working-directory: code/back
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy front
        working-directory: code/front
        run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test pow
        working-directory: code/pow
        run: cargo test --all-targets
      - name: Test cache
        working-directory: code/cache
        run: cargo test --all-targets
      - name: Test common
        working-directory: code/common
        run: cargo test
      - name: Test back
        working-directory: code/back
        run: cargo test
      - name: Test front (host)
        working-directory: code/front
        run: cargo test

  build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: jetli/trunk-action@v0.5.0
      - name: Build frontend
        working-directory: code/front
        run: env -u NO_COLOR trunk build

  audit:
    name: Security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit common
        working-directory: code/common
        run: cargo audit
      - name: Audit cache
        working-directory: code/cache
        run: cargo audit
      - name: Audit back
        working-directory: code/back
        run: cargo audit
      - name: Audit front
        working-directory: code/front
        run: cargo audit