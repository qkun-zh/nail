[workspace]
members = ["server", "cache", "common", "database", "emailer", "client", "pow", "searcher", "authorizer"]
resolver = "3"

[workspace.package]
edition = "2024"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
