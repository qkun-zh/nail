[package]
name = "nail_back"
version = "0.1.0"
edition = "2024"

[dependencies]
agdb = "0.13.2"
anyhow = "1.0.104"
axum = "0.8.9"
email_address = "0.2.9"
lettre = "0.11.23"
moka = { version = "0.12.16", features = ["sync"] }
nail_common = { path = "../common" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
time = { version = "0.3.55", features = ["formatting", "macros"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.24.0", features = ["serde", "v7"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
