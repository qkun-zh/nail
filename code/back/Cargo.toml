[package]
name = "nail_back"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[dependencies]
agdb = "0.13.2"
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["multipart"] }
cedar-policy = "4.12.0"
email_address = "0.2.9"
lettre = "0.11.23"
moka = { version = "0.12.16", features = ["sync"] }
nail_common = { path = "../common" }
seekstorm = { version = "3.3.5", default-features = false }
semver = "1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
time = { version = "0.3.55", features = ["formatting", "macros"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.19", features = ["io"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.24.0", features = ["serde", "v7"] }

[dev-dependencies]
tokio = { version = "1.53.1", features = ["io-util"] }
tower = { version = "0.5.3", features = ["util"] }

[build-dependencies]
cedar-policy = "4.12.0"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }
