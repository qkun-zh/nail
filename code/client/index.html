<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>nail</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-4 -4 8 8'%3E%3Ccircle r='3'/%3E%3C/svg%3E">
  <link data-trunk rel="css" href="search.css">
  <style>
    .toast-container {
      position: fixed;
      top: 24px;
      right: 24px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 10px;
      pointer-events: none;
    }

    .toast {
      --toast-accent: #475569;
      --toast-background: #f8fafc;
      --toast-border: #cbd5e1;
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 220px;
      max-width: 460px;
      padding: 12px 16px;
      border-radius: 10px;
      background: var(--toast-background);
      border: 1px solid var(--toast-border);
      border-left: 4px solid var(--toast-accent);
      box-shadow: 0 6px 18px rgba(15, 23, 42, 0.14);
      color: #1f2937;
      font-size: 14px;
      line-height: 1.5;
      animation: toast-in 0.25s ease-out;
      transition: opacity 0.2s ease;
    }

    .toast:hover {
      opacity: 0.35;
    }

    .toast--info {
      --toast-accent: #2563eb;
      --toast-background: #eff6ff;
      --toast-border: #bfdbfe;
    }

    .toast--success {
      --toast-accent: #16a34a;
      --toast-background: #f0fdf4;
      --toast-border: #bbf7d0;
    }

    .toast--warning {
      --toast-accent: #d97706;
      --toast-background: #fffbeb;
      --toast-border: #fde68a;
    }

    .toast--error {
      --toast-accent: #dc2626;
      --toast-background: #fef2f2;
      --toast-border: #fecaca;
    }

    .toast-dot {
      flex-shrink: 0;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--toast-accent);
    }

    .toast-message {
      flex: 1;
      word-break: break-word;
    }

    @keyframes toast-in {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
</body>
</html>
