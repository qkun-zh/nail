[package]
name = "nail_front"
version = "0.1.0"
edition.workspace = true

[dependencies]
anyhow = "1.0.104"
gloo-net = "0.7.0"
gloo-storage = "0.4.0"
gloo-timers = "0.3.0"
js-sys = "0.3.104"
leptos = { version = "0.8.20", features = ["csr"] }
leptos_router = "0.8.15"
nail_common = { version = "0.1.0", path = "../common" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"
uuid = { version = "1.24.0", features = ["js"] }
wasm-bindgen = "0.2.127"
web-sys = { version = "0.3.104", features = ["AbortController", "AbortSignal", "Blob", "Document", "Element", "File", "FileList", "FormData", "HtmlAnchorElement", "HtmlInputElement", "Location", "Node", "Url", "Window", "console"] }

[lints]
workspace = true
