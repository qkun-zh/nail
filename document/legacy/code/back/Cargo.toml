[package]
name = "nail_back"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { path = "../common" }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1.23.4", features = ["serde", "v4", "v7"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
agdb = "0.13.2"
seekstorm = { version = "3.3.5", default-features = false }
cedar-policy = "4.12"
serde_json = "1"
axum = { version = "0.8", features = ["multipart"] }
anyhow = "1.0.103"
hex = "0.4.3"
lettre = "0.11.22"
email_address = "0.2.9"
semver = "1"
# 访问日志/限流/请求体上限已迁至 pingap 反代，tower_governor 与
# tower-http 的 trace feature 不再需要（dev-dependencies 里仍保留 tower-http
# fs 用于端到端静态文件托管）。
# 存储栈（2026-08 agdb+seekstorm 迁移起）：agdb = 事实图数据（节点/边/事务），
# seekstorm = 搜索倒排索引（派生数据，default-features=false 免 pdfium/zh）。
moka = { version = "0.12.15", features = ["sync"] }
rand = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = "0.4"
tokio-util = { version = "0.7", features = ["io"] }
# 端到端测试专用（feature = "end_to_end" 才编译）：
# Cargo 不允许 optional dev-dependencies，故作为 optional 普通依赖放在这里，
# 由 feature 门控——普通 `cargo test` / `cargo build` 不编译 chromiumoxide /
# reqwest 的重依赖树（feature 只做测试代码门禁时，Cargo 仍会编译全部非
# optional 依赖，这正是之前 chromiumoxide 每次都编进的原因）。
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls", "stream"], default-features = false, optional = true }
chromiumoxide = { version = "0.9.1", optional = true }
futures = { version = "0.3", optional = true }

[features]
# 端到端测试门禁：默认关闭。`cargo test --features end_to_end` 才编进并跑
# （含真实 TCP/HTTP + SMTP sink；浏览器场景）。依赖门控见上方 [dependencies]。
end_to_end = ["dep:reqwest", "dep:chromiumoxide", "dep:futures"]

[dev-dependencies]
# 端到端测试：tower::ServiceExt::oneshot 直接打真实 axum 路由
tower = { version = "0.5", features = ["util"] }
# 端到端静态文件托管（浏览器场景挂 code/front/dist）：tower-http 已是主依赖，
# dev 侧只补 fs feature（仅测试构建生效，不影响生产二进制）
tower-http = { version = "0.6", features = ["fs"] }
# SMTP sink：进程内假 SMTP 服务器用 TcpListener
tokio = { version = "1", features = ["io-util", "net", "macros"] }
