[package]
name = "nail_front"
version = "0.1.0"
edition = "2024"

[dependencies]
common = { path = "../common" }
anyhow = "1.0.103"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
console_error_panic_hook = "0.1.7"
gloo-net = "0.7.0"
gloo-storage = "0.4.0"
gloo-timers = "0.3.0"
hex = "0.4.3"
leptos = { version = "0.8.19", features = ["csr"] }
leptos_router = "0.8.13"
serde_json = "1"
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Blob", "File", "FileList", "Url", "HtmlInputElement", "HtmlAnchorElement", "FormData", "AbortController", "AbortSignal", "Worker", "WorkerOptions", "WorkerType", "MessageEvent", "HtmlScriptElement", "HtmlCollection", "Element", "Node", "Window", "Document"] }
uuid = { version = "1.23.4", features = ["serde", "v4", "v7", "js"] }
